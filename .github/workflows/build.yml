name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q gtxfz-client-source.zip
      - name: Fix Module name clash
        run: |
          sed -i 's|^import com.gtxfz.client.module.\*;|import com.gtxfz.client.module.*;\nimport com.gtxfz.client.module.Module;|' gtxfz-client/src/main/java/com/gtxfz/client/GtxfzClient.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: gradle build
        working-directory: gtxfz-client
      - uses: actions/upload-artifact@v4
        with:
          name: gtxfz-client-jar
          path: gtxfz-client/build/libs/*.jar
